name: Bug report
description: Something in cipherASCII misbehaves
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug, and what you expected instead.
      placeholder: Rendering a 120-column image with the Gothic theme leaves the last row blank...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, starting from a fresh launch if possible.
      placeholder: |
        1. npm run electron:dev
        2. Drop a PNG onto the canvas
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version from *Help → About*, or the commit hash if running from source.
      placeholder: 0.1.0 / a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Browser (npm run dev)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: DevTools console output, terminal errors, or a screenshot. Redact anything private.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
