<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="cipherASCII render pipeline: import, render worker, grid, compositor, canvas, export, with a looping cell-effect stage">
  <title>cipherASCII render pipeline</title>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4a53c"/>
    </marker>
    <marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7660"/>
    </marker>

    <!-- connector geometry, reused by marching dashes and packet dots -->
    <path id="p1" d="M180 210 H212"/>
    <path id="p2" d="M620 210 H662"/>
    <path id="p3" d="M810 210 H852"/>
    <path id="p4" d="M1020 210 H1052"/>
    <path id="p5" d="M1130 250 V302"/>
    <path id="p6" d="M740 250 V302"/>
    <path id="p7" d="M810 350 C880 350 940 322 940 256"/>
    <path id="p8" d="M554 173 V184 H278 V193"/>
    <path id="ploop" d="M816 304 H664 A10 10 0 0 0 654 314 V380 A10 10 0 0 0 664 390 H816 A10 10 0 0 0 826 380 V314 A10 10 0 0 0 816 304 Z"/>

    <style>
      .node   { fill:#241e18; stroke:#3a2e22; stroke-width:1.5; }
      .chip   { fill:#15120f; stroke:#3a2e22; stroke-width:1.5; }
      .wrap   { fill:#1d1813; stroke:#4a3e2e; stroke-width:1.5; stroke-dasharray:7 5; }
      .t      { fill:#f5f0e8; font-size:15px; font-weight:700; letter-spacing:.5px; }
      .ts     { fill:#a89b8a; font-size:11px; }
      .tc     { fill:#e8dcc8; font-size:11.5px; }
      .lab    { fill:#d4a53c; font-size:12.5px; font-weight:700; letter-spacing:1.2px; }
      .note   { fill:#8a7660; font-size:11px; }
      .wire   { stroke:#d4a53c; stroke-width:2; fill:none; stroke-dasharray:6 6; opacity:.75; }
      .wire-i { stroke:#8a7660; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- page -->
  <rect width="1240" height="470" rx="14" fill="#1a1612"/>
  <text x="40" y="40" class="lab" font-size="15">CIPHERASCII · RENDER PIPELINE</text>
  <text x="1200" y="40" class="note" text-anchor="end">pure core · worker offload · self-stopping rAF</text>

  <!-- IMPORT -->
  <rect x="40" y="170" width="140" height="80" rx="10" class="node"/>
  <text x="110" y="206" class="t" text-anchor="middle">IMPORT</text>
  <text x="110" y="229" class="ts" text-anchor="middle">image · text · drop</text>

  <!-- RENDER WORKER -->
  <rect x="220" y="70" width="400" height="280" rx="12" class="wrap"/>
  <text x="240" y="100" class="lab">RENDER WORKER</text>
  <text x="600" y="100" class="note" text-anchor="end">offscreen thread</text>

  <!-- row 1 -->
  <rect x="236" y="135" width="84" height="38" rx="7" class="chip"/>
  <text x="278" y="159" class="tc" text-anchor="middle">crop</text>
  <rect x="328" y="135" width="84" height="38" rx="7" class="chip"/>
  <text x="370" y="159" class="tc" text-anchor="middle">resize</text>
  <rect x="420" y="135" width="84" height="38" rx="7" class="chip"/>
  <text x="462" y="159" class="tc" text-anchor="middle">effects</text>
  <rect x="512" y="135" width="84" height="38" rx="7" class="chip"/>
  <text x="554" y="159" class="tc" text-anchor="middle">preprocess</text>
  <text x="324" y="160" class="note" text-anchor="middle">›</text>
  <text x="416" y="160" class="note" text-anchor="middle">›</text>
  <text x="508" y="160" class="note" text-anchor="middle">›</text>

  <!-- row 2 -->
  <rect x="236" y="193" width="84" height="38" rx="7" class="chip"/>
  <text x="278" y="217" class="tc" text-anchor="middle">luma</text>
  <rect x="328" y="193" width="84" height="38" rx="7" class="chip"/>
  <text x="370" y="217" class="tc" text-anchor="middle">map</text>
  <rect x="420" y="193" width="84" height="38" rx="7" class="chip"/>
  <text x="462" y="217" class="tc" text-anchor="middle">dither</text>
  <rect x="512" y="193" width="84" height="38" rx="7" class="chip"/>
  <text x="554" y="217" class="tc" text-anchor="middle">glyphs</text>
  <text x="324" y="218" class="note" text-anchor="middle">›</text>
  <text x="416" y="218" class="note" text-anchor="middle">›</text>
  <text x="508" y="218" class="note" text-anchor="middle">›</text>

  <!-- worker notes -->
  <text x="240" y="272" class="note">jobId guard drops stale renders · cooperative cancel</text>
  <text x="240" y="294" class="note">pooled ping-pong buffers — 512² six-effect stack 195 → 118 ms</text>
  <text x="240" y="316" class="note">effectSpace: effects at source resolution or on the grid</text>

  <!-- GRID -->
  <rect x="670" y="170" width="140" height="80" rx="10" class="node"/>
  <text x="740" y="206" class="t" text-anchor="middle">GRID</text>
  <text x="740" y="229" class="ts" text-anchor="middle">AsciiGrid</text>

  <!-- COMPOSITOR -->
  <rect x="860" y="170" width="160" height="80" rx="10" class="node"/>
  <text x="940" y="206" class="t" text-anchor="middle">COMPOSITOR</text>
  <text x="940" y="229" class="ts" text-anchor="middle">layers · blend · dirty diff</text>

  <!-- CANVAS -->
  <rect x="1060" y="170" width="140" height="80" rx="10" class="node"/>
  <text x="1130" y="206" class="t" text-anchor="middle">CANVAS</text>
  <text x="1130" y="229" class="ts" text-anchor="middle">2D + PixiJS GPU</text>

  <!-- EXPORT -->
  <rect x="1060" y="310" width="140" height="80" rx="10" class="node"/>
  <text x="1130" y="346" class="t" text-anchor="middle">EXPORT</text>
  <text x="1130" y="369" class="ts" text-anchor="middle">txt·png·svg·html·mp4·gif</text>

  <!-- CELL FX (live loop) -->
  <rect x="670" y="310" width="140" height="80" rx="10" class="node"/>
  <text x="740" y="346" class="t" text-anchor="middle">CELL FX</text>
  <text x="740" y="369" class="ts" text-anchor="middle">45 effects · masks · seed</text>
  <use xlink:href="#ploop" href="#ploop" class="wire" stroke-dasharray="8 7">
    <animate attributeName="stroke-dashoffset" values="0;-30" dur="1.1s" repeatCount="indefinite"/>
  </use>
  <text x="740" y="416" class="note" text-anchor="middle">requestAnimationFrame · stops itself when every one-shot settles</text>

  <!-- static connector base -->
  <use xlink:href="#p1" href="#p1" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p2" href="#p2" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p3" href="#p3" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p4" href="#p4" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p5" href="#p5" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p6" href="#p6" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p7" href="#p7" class="wire-i" marker-end="url(#ah-dim)"/>
  <use xlink:href="#p8" href="#p8" class="wire-i" marker-end="url(#ah-dim)"/>

  <!-- marching dashes on every connector -->
  <use xlink:href="#p1" href="#p1" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p2" href="#p2" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".15s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p3" href="#p3" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p4" href="#p4" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".45s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p5" href="#p5" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".6s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p6" href="#p6" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p7" href="#p7" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#p8" href="#p8" class="wire">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur=".7s" begin=".35s" repeatCount="indefinite"/>
  </use>

  <!-- worker stages light up in pipeline order -->
  <rect x="236" y="135" width="84" height="38" rx="7" fill="none" stroke="#d4a53c" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="328" y="135" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin=".3s" repeatCount="indefinite"/>
  </rect>
  <rect x="420" y="135" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
  </rect>
  <rect x="512" y="135" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin=".9s" repeatCount="indefinite"/>
  </rect>
  <rect x="236" y="193" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="328" y="193" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="420" y="193" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="512" y="193" width="84" height="38" rx="7" fill="none" stroke="#3a2e22" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a2e22;#e8c05c;#3a2e22" dur="2.4s" begin="2.1s" repeatCount="indefinite"/>
  </rect>

  <!-- payload packets riding the connectors -->
  <circle r="4.5" fill="#e8c05c">
    <animateMotion dur="2s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath xlink:href="#p1" href="#p1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#e8c05c">
    <animateMotion dur="2s" begin=".5s" repeatCount="indefinite">
      <mpath xlink:href="#p2" href="#p2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin=".5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#e8c05c">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite">
      <mpath xlink:href="#p3" href="#p3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#e8c05c">
    <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite">
      <mpath xlink:href="#p4" href="#p4"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#86efac">
    <animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite">
      <mpath xlink:href="#p7" href="#p7"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
  </circle>

  <!-- caption -->
  <text x="40" y="446" class="note">every stage above lives in src/core/** as DOM-free TypeScript — the worker, the compositor and the rAF loop are implementations of the same tested functions.</text>
</svg>
